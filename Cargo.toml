[workspace]
members = [
    "crates/matrix-core",
    "crates/matrix-call",
    "crates/matrixus",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Matrixus Developers"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
futures-util = "0.3"
thiserror = "1.0"
anyhow = "1.0"
url = { version = "2.5", features = ["serde"] }

# Matrix SDK dependencies
matrix-sdk = { version = "0.19.1", default-features = false, features = [
    "e2e-encryption",
    "sqlite",
    "rustls-aws-lc-rs",
    "markdown"
] }
matrix-sdk-ui = { version = "0.19.1", default-features = false, features = [
    "rustls-aws-lc-rs"
] }

# Desktop GTK4 / Libadwaita dependencies
gtk4 = { version = "0.11", features = ["v4_16"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
webkit6 = { version = "0.6" }
ashpd = { version = "0.10", features = ["raw_handle"] }
oo7 = "0.3"
